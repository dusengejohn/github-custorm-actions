name: 'Get and Cache Dependencies'
description: 'Get code and cache dependencies'
inputs:
  cache-key:
    description: 'The key to use for caching dependencies'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Cache dependencies
      if: ${{ inputs.cache-key == 'true' }}
      id: cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true' || inputs.cache-key != 'true'
      run: npm ci
      shell: bash
    