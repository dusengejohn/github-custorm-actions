name: Deployment
on:
  push:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: load and cache dependencies
        uses: ./.github/actions/cache-dependancies
        with:
          cache-key: 'false'
      - name: Lint code
        run: npm run lint
      - name: Print GITHUB_TOKEN
        run: |
          echo This is secret GITHUB_TOKEN ${{ secrets.GITHUB_TOKEN }}
          echo This is github.token ${{ github.token }}
      - name: Print GITHUB_TOKEN as env variable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo This is secret GITHUB_TOKEN $GITHUB_TOKEN
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: load and cache dependencies
        uses: ./.github/actions/cache-dependancies
      - name: Test code
        id: run-tests
        run: npm run test
      - name: Upload test report
        if: failure() && steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test.json
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: load and cache dependencies
        uses: ./.github/actions/cache-dependancies
      - name: Build website
        run: npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Get build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: ./dist
      - name: Output contents
        run: ls
      - name: Deploy site
        run: echo "Deploying..."
      - name: Print a debug message
        run: echo "::debug::This is a debug message"